name: check

on:
  push:
  pull_request:

jobs:
  pages-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generated pages match src/
        run: python3 build.py --check
